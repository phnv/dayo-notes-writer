inputs:
  clipboard: clipboard
  text: text
  file: file

templates:
  meeting: templates/meeting.md
  weekly: templates/weekly.md
  personal: templates/personal.md

prompts:
  write: prompts/WRITE_NOTE_PROMPT.md
  update: prompts/UPDATE_NOTE_PROMPT.md
  personal: prompts/personal.md

storage:
  inbox: /mnt/c/Users/Home/Documents/notes/inbox
  # reviews: ~/notes/reviews_drafts

bundles:
  daily_review:
    template: weekly
    prompt: write
    storage: reviews
    options:
      overwrite: false
  meeting_notes:
    template: meeting
    prompt: write
    storage: inbox
    options:
      overwrite: false
  inbox:
    template: personal
    prompt: personal
    storage: inbox
    options:
      overwrite: false

defaults:
  bundle: inbox

frontmatter:
  enabled: true
  format: yaml

options:
  overwrite: false
  backup: true
