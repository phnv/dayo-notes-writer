inputs:
  clipboard: clipboard
  text: text
  file: file

templates:
  weekly: templates/weekly.md
  meeting: templates/meeting.md

prompts:
  clean: prompts/WRITE_NOTE_PROMPT.md
  meeting_rewrite: prompts/WRITE_NOTE_PROMPT.md

storage:
  inbox: ~/notes/inbox
  reviews: ~/notes/reviews

bundles:
  daily_review:
    template: weekly
    prompt: clean
    storage: reviews
    options:
      overwrite: false

defaults:
  bundle: daily_review

frontmatter:
  enabled: true
  format: yaml

options:
  overwrite: false
  backup: true
